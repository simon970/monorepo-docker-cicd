name: Deploy Backend to Stage

on: 
    push:
        branches: [main]

jobs:
    build:
       runs-on: ubuntu-latest
       steps:
         - name: Checkout the code
           uses: actions/checkout@v2

         - name: Setup Bun
           uses: oven-sh/setup-bun@v2
           with:
             bun-version: 1.3.14
         - name: Install dependencies
           run: bun install
         
         - name: Docker login
           uses: docker/login-action@v4
           with:
              username: ${{secrets.DOCKERHUB_USERNAME}}
              password: ${{secrets.DOCKERHUB_TOKEN}}

         - name: Apply database migrations
           working-directory: packages/db
           env:
            DATABASE_URL: ${{ secrets.DATABASE_URL }}
           run: bunx prisma migrate deploy
         
         - name: Build and Push
           uses: docker/build-push-action@v6
           with:
            context: .
            file: ./docker/Dockerfile.be
            push: true
            tags: simonpaul496/todo-app-backend:${{github.sha}}
            
         - name: Deploy to VM
           run: |
             echo "${{secrets.SSH_PRIVATE_KEY}}" &> ~/ssh_key &
             chmod 700 /home/runner/ssh_key
             ssh -o StrictHostKeyChecking=no -i ~/ssh_key root@104.248.120.123 -t "docker stop todo-backend && docker run -d --name todo-backend --restart unless-stopped --env-file /opt/todo-app/.env -p 8000:8000 simonpaul496/todo-app-backend:${{github.sha}} "



        